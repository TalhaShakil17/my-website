<!DOCTYPE html>
<html>
<head>
    <title>Click Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: lightblue;
        }

        h1 {
            color: darkblue;
        }

        img {
            width: 150px;
            margin: 10px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Click Game 🎮</h1>

    <!-- Minecraft Player Image -->
    <img src="https://via.placeholder.com/150" alt="Minecraft Player">

    <p>Time: <span id="time">10</span> seconds</p>
    <p>Score: <span id="score">0</span></p>

    <button onclick="clickGame()">CLICK FAST!</button>
    <button onclick="restartGame()">RESTART 🔁</button>

    <script>
        let score = 0;
        let timeLeft = 10;
        let gameActive = true;
        let timerStarted = false;
        let timer;

        function startTimer() {
            timer = setInterval(function() {
                timeLeft--;
                document.getElementById("time").innerText = timeLeft;

                if (timeLeft <= 0) {
                    gameActive = false;
                    clearInterval(timer);
                    alert("Game Over! Your score is: " + score);
                }
            }, 1000);
        }

        function clickGame() {
            if (!timerStarted) {
                startTimer();
                timerStarted = true;
            }

            if (gameActive) {
                score++;
                document.getElementById("score").innerText = score;
            }
        }

        function restartGame() {
            clearInterval(timer);

            score = 0;
            timeLeft = 10;
            gameActive = true;
            timerStarted = false;

            document.getElementById("score").innerText = score;
            document.getElementById("time").innerText = timeLeft;
        }
    </script>

</body>
</html>
